    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5a36"/><stop offset="1" stop-color="#5e3a22"/></linearGradient>
    <linearGradient id="sweater" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3ecdf"/><stop offset="1" stop-color="#d8ccb6"/></linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a3b8aa"/><stop offset="1" stop-color="#7b9384"/></linearGradient>
